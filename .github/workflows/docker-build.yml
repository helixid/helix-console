name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: helixid/helix-console

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@v3

      # No `docker/login-action` or push yet — there is no helixid Docker
      # Hub account to push to. Iteration 2, once it exists:
      #   1. Create the "helixid" org on Docker Hub and a repo access token.
      #   2. Add repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      #   3. Add a `docker/login-action@v3` step here using those secrets.
      #   4. Set `push: true` below (gate it on
      #      `github.ref == 'refs/heads/main'` so PR builds still don't
      #      push) and add real tags (`latest`, git sha) in place of the
      #      build-only tag.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
